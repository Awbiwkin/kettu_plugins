name: hash

# Загрузчик решает, качать ли плагин заново, по полю hash в манифесте.
# Забыл его поменять — на телефоне останется старая версия. Этот workflow
# пересчитывает хеши сам при каждом пуше, так что руками ничего делать не надо.

on:
  push:
    branches: [main]
    paths: ["**/index.js"]

permissions:
  contents: write

jobs:
  update-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: пересчитать hash в манифестах
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          for manifest in pathlib.Path(".").rglob("manifest.json"):
              js = manifest.parent / "index.js"
              if not js.exists():
                  continue
              data = json.loads(manifest.read_text(encoding="utf-8"))
              new = hashlib.sha256(js.read_bytes()).hexdigest()
              if data.get("hash") != new:
                  data["hash"] = new
                  manifest.write_text(
                      json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                      encoding="utf-8")
                  print("обновлён", manifest)
          PY

      - name: закоммитить, если что-то поменялось
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add .
            git commit -m "hash: пересчёт после правки плагина"
            git push
          fi
